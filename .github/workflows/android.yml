# Build app lịch âm Android (widget lịch tháng 4x4), chạy test lịch âm bằng bộ số liệu dùng chung với
# bản TypeScript, rồi đính APK vào bản phát hành mới trên GitHub để tải thẳng về điện thoại.
# Không cần cài Android Studio trên máy.
name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "shared/test/lunar-cases.json", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      # Khoá ký cố định để bản mới cài đè được bản cũ (nút "Cập nhật" trong app). Lần build đầu tự tạo
      # khoá rồi lưu vào repo (android/release-key.p12); các lần sau dùng lại, không bao giờ tạo lại.
      # Mật khẩu: Secret ANDROID_KEYSTORE_PASSWORD nếu có; không có thì dùng mật khẩu ghi sẵn dưới đây
      # (user chốt 2026-11-18: app cá nhân, chấp nhận khoá công khai để khỏi phải đặt Secret). Rủi ro:
      # người khác ký được APK giả cùng khoá, nhưng chỉ cài được nếu chủ máy tự tải file lạ về cài; nút
      # Cập nhật trong app chỉ tải từ Releases của repo này.
      - name: Khoá ký cố định
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'mylunarcalendar-public-key' }}
        run: |
          KS=android/release-key.p12
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -alias app -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=MyLunarCalendar"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$KS"
            git commit -m "chore: khoá ký APK cố định (CI tạo tự động một lần) [skip ci]"
            git push
          fi
          echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/$KS" >> "$GITHUB_ENV"

      # Test lịch âm sai thì dừng, không phát hành
      - name: Test và build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'mylunarcalendar-public-key' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'mylunarcalendar-public-key' }}
          ANDROID_KEY_ALIAS: app
        run: |
          gradle --no-daemon test assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/mylunarcalendar.apk"

      - name: Phát hành
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-v${{ github.run_number }}"
          gh release create "$tag" "$RUNNER_TEMP/mylunarcalendar.apk" \
            --title "MyLunarCalendar 1.0.${{ github.run_number }}" \
            --notes "Tải mylunarcalendar.apk về điện thoại Android rồi mở để cài (cho phép cài từ nguồn này nếu máy hỏi). Mở app Lịch âm, bấm \"Thêm widget ra màn hình chính\" để đặt lịch tháng 4x4. App chạy hoàn toàn trên máy, không cần mạng." \
            --target "${{ github.sha }}" --latest
